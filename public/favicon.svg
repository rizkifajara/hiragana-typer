<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#1E1B4B" stroke-width="1"/>
  
  <!-- Hiragana characters -->
  <text x="16" y="12" font-family="serif" font-size="8" fill="white" text-anchor="middle">あ</text>
  <text x="16" y="22" font-family="serif" font-size="6" fill="white" text-anchor="middle">か</text>
  
  <!-- Small accent dots -->
  <circle cx="20" cy="8" r="1" fill="#FCD34D"/>
  <circle cx="12" cy="24" r="1" fill="#FCD34D"/>
</svg>